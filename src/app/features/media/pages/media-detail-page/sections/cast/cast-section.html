<div class="cast-list">
  <h2 class="title">Actors</h2>

  <app-carousel
    [items]="cast()"
    [loading]="loading()"
    [cardWidth]="155"
    [emptyMessage]="'No credits available for this ' + (mediaType() === 'movie' ? 'movie' : 'TV show')"
  >
    <ng-template #slide let-member>
      @if (member.profileUrl) {
        <a class="actor-link" [routerLink]="['/people', member.id]">
          <div class="actor-box">
            <img
              class="actor-image"
              [src]="member.profileUrl"
              [alt]="member.name"
            />
            <div class="actor-info">
              <p class="actor-name">{{ member.name }}</p>
              <p class="actor-role">
                Role: {{ member.character || 'minor' }}
              </p>
            </div>
          </div>
        </a>
      }
    </ng-template>
  </app-carousel>
</div>
