<section class="recommendations">
  <h2 class="recommendations__title">You may also like</h2>

  <app-carousel
    [items]="items()"
    [cardWidth]="162"
    [emptyMessage]="'No recommendations'"
  >
    <ng-template #slide let-item>
      <a class="recommendations__link" [routerLink]="detailLink(item.id)">
        <div class="recommendations__slide">
          @if (item.posterUrl) {
            <img
              class="recommendations__poster"
              [src]="item.posterUrl"
              [alt]="item.title"
              loading="lazy"
            />
          }
          <div class="recommendations__overlay">
            <span class="recommendations__name">{{ item.title }}</span>
          </div>
        </div>
      </a>
    </ng-template>
  </app-carousel>
</section>
