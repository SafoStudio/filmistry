<div class="container">
  <app-filters-panel
    [title]="filterTitle()"
    [filtersOpen]="filtersOpen()"
    [mediaType]="activeMediaType() === 'movie' ? 'movie' : 'tv'"
    [initialSort]="filterSort()"
    [initialGenres]="filterGenres()"
    [initialYear]="filterYear()"
    [initialRating]="filterRating()"
    (toggle)="toggleFilters()"
    (apply)="onFiltersApply($event)"
    (reset)="onFiltersReset()"
    (close)="closeFilters()"
  />

  @if (error()) {
    <p class="status status--error">{{ error() }}</p>
  } @else if (loading() && items().length === 0) {
    <app-loader />
  } @else if (isEmpty()) {
    <p class="media-page__empty">No results</p>
  } @else {
    <div
      class="movie-gallery"
      [class.movie-gallery--leaving]="isLeaving()"
    >
      @for (item of items(); track item.id; let i = $index) {
        <app-media-card
          class="movie-gallery__item"
          [style.--i]="i % 20"
          [media]="item"
          [mediaType]="activeMediaType()"
        />
      }
    </div>

    @if (canLoadMore()) {
      <app-load-more-button
        class="load-more-wrapper"
        [loading]="loadingMore()"
        (loadMore)="loadMore()"
      />
    }

    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
    />
  }
</div>
