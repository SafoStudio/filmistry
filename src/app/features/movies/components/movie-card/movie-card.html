<a class="movie-card" [routerLink]="['/movie', movie().id]">
  <div class="movie-card__poster">
    @if (movie().posterUrl) {
      <img [src]="movie().posterUrl" [alt]="movie().title" loading="lazy" />
    } @else {
      <div class="movie-card__placeholder">{{ movie().title }}</div>
    }
    <div class="movie-card__overlay">
      <span class="movie-card__title">{{ movie().title }}</span>
      <span class="movie-card__year">{{ movie().releaseYear }}</span>
    </div>
  </div>
</a>
