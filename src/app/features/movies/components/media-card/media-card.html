<a
  class="movie-card"
  [routerLink]="[mediaType() === 'movie' ? '/movies' : '/tv', media().id]"
>
  <div class="movie-card__poster">
    @if (media().posterUrl) {
      <img [src]="media().posterUrl" [alt]="media().title" loading="lazy" />
    } @else {
      <div class="movie-card__placeholder">{{ media().title }}</div>
    }
    <div class="movie-card__overlay">
      <span class="movie-card__title">{{ media().title }}</span>
    </div>
  </div>
</a>
