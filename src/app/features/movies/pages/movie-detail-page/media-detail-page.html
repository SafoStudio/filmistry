@if (loading()) {
  <app-loader />
} @else if (error()) {
  <p class="status status--error">{{ error() }}</p>
} @else if (movie(); as m) {
  <section
    class="backgroundImageContainer"
    [class.backgroundImageContainer--closing]="isClosing()"
    [style.backgroundImage]="m.backdropUrl ? 'url(' + m.backdropUrl + ')' : 'none'"
  >
    <button
      type="button"
      class="pageCurl"
      [class.pageCurl--closing]="isClosing()"
      (click)="closeDetail()"
      aria-label="Close"
    >
      <span class="pageCurl__fold"></span>
      <span class="pageCurl__shadow"></span>
      <span class="pageCurl__hint">
        <app-icon name="close" [size]="16" />
      </span>
    </button>

    <div class="movieCard movieCard--visible">
      <div class="posterImage fade-item" style="--i: 0">
        @if (m.posterUrl) {
          <img [src]="m.posterUrl" [alt]="m.title" />
        }
      </div>

      <div class="description">
        <div class="info">
          <div class="titleBox fade-item" style="--i: 1">
            <h1>{{ m.title }}</h1>
          </div>

          <div class="ratingBox fade-item" style="--i: 2">
            <app-rating-bar [rating]="m.voteAverage" />
            <p class="releaseYear">
              {{ m.releaseYear }}
              <span class="releaseYearText">release year</span>
            </p>
            <div class="genresBox">
              <p>{{ m.genres.join(', ') }}</p>
            </div>
          </div>

          <p class="overview fade-item" style="--i: 3">{{ m.overview }}</p>
        </div>

        <div class="addInfo fade-item" style="--i: 4">
          <div class="linkBox" [class.linkBox--active]="activeSection() === 'cast'">
            <button type="button" class="linkPage" (click)="toggleSection('cast')" aria-label="Cast">
              <app-icon name="users" [size]="22" />
            </button>
          </div>
          <div class="linkBox" [class.linkBox--active]="activeSection() === 'reviews'">
            <button type="button" class="linkPage" (click)="toggleSection('reviews')" aria-label="Reviews">
              <app-icon name="comments" [size]="22" />
            </button>
          </div>
          <div class="linkBox" [class.linkBox--active]="activeSection() === 'gallery'">
            <button type="button" class="linkPage" (click)="toggleSection('gallery')" aria-label="Gallery">
              <app-icon name="images" [size]="22" />
            </button>
          </div>
          <button type="button" class="button" (click)="openTrailer()" aria-label="Play trailer">
            <app-icon name="play" [size]="32" />
          </button>
        </div>
      </div>
    </div>
  </section>

  @if (activeSection()) {
    <div class="sections">
      <router-outlet />
    </div>
  }

  @if (isTrailerOpen() && trailerUrl(); as url) {
    <div class="trailer-modal" (click)="closeTrailer()">
      <div class="trailer-modal__content" (click)="$event.stopPropagation()">
        <button type="button" class="trailer-modal__close" (click)="closeTrailer()">✖</button>
        <iframe [src]="url" title="Trailer" allowfullscreen></iframe>
      </div>
    </div>
  }
}
