@if (loading()) {
  <p class="no-images">Loading...</p>
} @else if (totalSlides() === 0) {
  <p class="no-images">No Images</p>
} @else {
  <section class="container">
    <h2 class="title">Gallery</h2>
    <div>
      <p class="counter-img">{{ counter() }}</p>

      @for (item of images(); track $index) {
        <div class="gallery-list" [class.active]="$index === currentSlide()">
          <img
            class="gallery-img"
            [src]="item.url"
            [alt]="'Backdrop ' + $index"
          />
        </div>
      }

      <button type="button" class="gallery-left-btn" (click)="prev()">‹</button>
      <button type="button" class="gallery-right-btn" (click)="next()">›</button>
    </div>
  </section>
}
