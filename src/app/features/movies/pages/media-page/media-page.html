<div class="container">
  @if (error()) {
    <p class="status status--error">{{ error() }}</p>
  } @else if (loading() && items().length === 0) {
    <app-loader />
  } @else {
    <div
      class="movie-gallery"
      [class.movie-gallery--leaving]="isLeaving()"
    >
      @for (item of items(); track item.id; let i = $index) {
        <app-media-card
          class="movie-gallery__item"
          [style.--i]="i"
          [media]="item"
          [mediaType]="mediaType()"
        />
      }
    </div>

    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="onPageChange($event)"
    />
  }
</div>
