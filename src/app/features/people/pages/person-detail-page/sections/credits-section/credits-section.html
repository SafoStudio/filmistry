<section class="credits">
  <h2 class="credits__title">Films &amp; Series</h2>

  <app-carousel
    [items]="credits()"
    [loading]="loading()"
    [cardWidth]="162"
    [emptyMessage]="'No credits available'"
  >
    <ng-template #slide let-credit>
      <a class="credits__link" [routerLink]="detailLink(credit)">
        <div class="credits__slide">
          @if (credit.posterUrl) {
            <img
              class="credits__poster"
              [src]="credit.posterUrl"
              [alt]="credit.title"
              loading="lazy"
            />
          }
          <div class="credits__overlay">
            <span class="credits__name">{{ credit.title }}</span>
          </div>
        </div>
      </a>
    </ng-template>
  </app-carousel>
</section>
