<div class="filters" [class.filters--open]="filtersOpen()">
  <div class="filters__bar" #bar>
    <div
      class="filters__title"
      #titleEl
      [style.transform]="'translateX(' + titleOffset() + 'px)'"
    >
      {{ title() }}
    </div>

    <button
      type="button"
      class="filters__toggle"
      #toggle
      [style.transform]="'translateX(' + toggleOffset() + 'px)'"
      [class.filters__toggle--active]="filtersOpen()"
      [class.filters__toggle--has-active]="hasActiveFilters"
      (click)="onToggle()"
      aria-label="Toggle filters"
    >
      <app-icon name="filter" [size]="20" />
      <span class="filters__toggle-text">
        {{ filtersOpen() ? 'Hide filters' : 'Show filters' }}
      </span>
    </button>
  </div>

  <div
    class="filters__panel"
    [class.filters__panel--open]="filtersOpen()"
  >
    <div class="filters__genres">
      <div class="filters__label-block">Genres</div>

      @if (genresLoading()) {
        <div class="filters__genres-loading">Loading genres...</div>
      } @else {
        <div class="filters__chips">
          @for (genre of genres(); track genre.id) {
            <button
              type="button"
              class="filters__chip"
              [class.filters__chip--active]="isGenreSelected(genre.id)"
              (click)="toggleGenre(genre.id)"
            >
              {{ genre.name }}
            </button>
          }
        </div>
      }
    </div>

    <div class="filters__controls">
      <label class="filters__label">
        Sort by
        <select
          class="filters__select"
          [value]="selectedSort()"
          (change)="onSortChange($event)"
        >
          @for (opt of sortList; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </label>

      <label class="filters__label">
        Year
        <select
          class="filters__select"
          [value]="selectedYear() ?? ''"
          (change)="onYearChange($event)"
        >
          <option value="">Any</option>
          @for (y of years; track y) {
            <option [value]="y">{{ y }}</option>
          }
        </select>
      </label>

      <label class="filters__label">
        Rating
        <select
          class="filters__select"
          [value]="selectedRating() ?? ''"
          (change)="onRatingChange($event)"
        >
          <option value="">Any</option>
          @for (opt of ratingOptions; track opt.value) {
            <option [value]="opt.value">{{ opt.label }}</option>
          }
        </select>
      </label>

      <div class="filters__actions">
        <button
          type="button"
          class="filters__btn filters__btn--primary"
          (click)="onApply()"
        >
          Apply
        </button>
        <button
          type="button"
          class="filters__btn filters__btn--secondary"
          (click)="onReset()"
        >
          Reset
        </button>
      </div>
    </div>
  </div>
</div>
