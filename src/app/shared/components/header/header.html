<header class="header" [class.header--hidden]="hidden()">
  <div class="header__inner">
    <a class="header__logo" routerLink="/" (click)="closeMenu()">Filmistry</a>

    <button
      type="button"
      class="header__burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle menu"
    >
      <span class="header__burger-line"></span>
      <span class="header__burger-line"></span>
      <span class="header__burger-line"></span>
    </button>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()">
      <a
        routerLink="/"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="header__link"
        (click)="closeMenu()"
      >
        <span class="header__label">Home</span>
        <app-icon name="home" [size]="32" />
      </a>
      <a
        routerLink="/movies"
        routerLinkActive="header__link--active"
        class="header__link"
        (click)="closeMenu()"
      >
        <span class="header__label">Movies</span>
        <app-icon name="film" [size]="28" />
      </a>
      <a
        routerLink="/tv"
        routerLinkActive="header__link--active"
        class="header__link"
        (click)="closeMenu()"
      >
        <span class="header__label">TV Shows</span>
        <app-icon name="tv" [size]="28" />
      </a>
      <a
        routerLink="/people"
        routerLinkActive="header__link--active"
        class="header__link"
        (click)="closeMenu()"
      >
        <span class="header__label">Stars</span>
        <app-icon name="star" [size]="32" />
      </a>
    </nav>

    <div class="header__actions">
      <app-theme-toggle />
    </div>
  </div>
</header>
